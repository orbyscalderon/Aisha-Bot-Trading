[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copy-trading-bot"
version = "0.1.0"
description = "Bot de copy-trading: backtest y ejecución simulada (la ejecución real no existe todavía)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "ccxt>=4.4",
    "typer>=0.12",
    "httpx>=0.27",
    # La API de apscheduler 4 es otra: el código usa la 3.x.
    "apscheduler>=3.10,<4",
    "quantstats>=0.0.62",
]

[project.scripts]
copybot = "cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["core*", "ports*", "storage*", "adapters*", "backtest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
